openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.1
tags: []
paths:
  /health:
    get:
      operationId: health
      description: Проверка живости сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Текущее состояние; живой сервис отвечает "ok".
      description: Ответ проверки живости сервиса.
