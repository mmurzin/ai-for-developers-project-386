openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.1
tags: []
paths:
  /api/call-types:
    post:
      operationId: createCallType
      description: Создать Тип звонка (Владелец страницы).
      parameters: []
      responses:
        '201':
          description: Тип звонка создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallType'
        '409':
          description: Дубликат идентификатора Типа звонка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Ошибка валидации данных запроса.Ошибка валидации данных запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallTypeRequest'
    get:
      operationId: listCallTypes
      description: 'Список Типов звонков (публично: их видит Гость).'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTypeList'
  /api/call-types/{id}/slots:
    get:
      operationId: listSlots
      description: |-
        Слоты Типа звонка (публично: их видит Гость): вычисленная сетка
        на Окно записи — 14 календарных дней со следующего дня,
        Рабочие часы 9:00–18:00 Europe/Moscow, старты каждые 15 минут.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
        '404':
          description: Ресурс не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /health:
    get:
      operationId: health
      description: Проверка живости сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    CallType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Идентификатор: строковый, задаёт Владелец страницы.'
        name:
          type: string
          description: Название для отображения Гостю.
        description:
          type: string
          description: Описание вида Звонка.
        durationMinutes:
          type: integer
          format: int32
          description: 'Длительность звонка в минутах: целое от 5 до 240.'
      description: 'Тип звонка: набор параметров, который задаёт Владелец страницы.'
    CallTypeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CallType'
          description: Созданные Типы звонков.
      description: Список Типов звонков.
    CreateCallTypeRequest:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Идентификатор: строковый, задаёт Владелец страницы.'
        name:
          type: string
          description: Название для отображения Гостю.
        description:
          type: string
          description: Описание вида Звонка.
        durationMinutes:
          type: integer
          format: int32
          description: 'Длительность звонка в минутах: целое от 5 до 240.'
      description: Данные для создания Типа звонка.
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable код ошибки.
        message:
          type: string
          description: Сообщение для человека.
      description: |-
        Тело ошибки: machine-readable код + сообщение для человека.

        Коды (snake_case), используемые сервисом:
        - `malformed_json` — тело запроса не является корректным JSON (400);
        - `invalid_field_type` — поле запроса имеет неверный тип,
        например нецелая длительность (422);
        - `empty_id` — пустой идентификатор Типа звонка (422);
        - `empty_name` — пустое название Типа звонка (422);
        - `duration_out_of_range` — Длительность звонка вне 5–240 минут (422);
        - `duplicate_id` — идентификатор Типа звонка уже существует (409);
        - `call_type_not_found` — Тип звонка по идентификатору не найден (404).
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Текущее состояние; живой сервис отвечает "ok".
      description: Ответ проверки живости сервиса.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
          description: Начало Слота; ISO 8601 с явным смещением часового пояса.
        endsAt:
          type: string
          format: date-time
          description: 'Конец Слота: начало плюс Длительность звонка Типа звонка.'
      description: |-
        Слот: свободное место для Звонка внутри Окна записи и Рабочих часов,
        вмещающее Звонок выбранного Типа звонка целиком (GLOSSARY.md).
        Вычисляется на лету, не хранится.
    SlotList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Свободные Слоты внутри Окна записи, по порядку времени.
      description: Список Слотов Типа звонка на Окно записи.
