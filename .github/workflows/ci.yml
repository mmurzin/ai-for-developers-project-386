name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - run: mise run api-check
      - run: mise run lint
      - run: mise run test-junit
      - run: mise run frontend-test-junit

      - uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: reports/*.xml
