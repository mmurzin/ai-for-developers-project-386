version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - gosec
    - intrange
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
